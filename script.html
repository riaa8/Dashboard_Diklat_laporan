}

/**
 * Tabel utama — format persis Over Acceptance Rate:
 * baris = kategori, kolom = bulan (SM | SACC) + Total
 */
function renderLaporanTable(res) {
    const thead = document.getElementById('laporan-main-thead');
    const tbody = document.getElementById('laporan-main-tbody');
    if (!thead || !tbody) return;

    // --- HEADER ---
    // Row 1: Perihal | Jan (2 col) | Feb (2 col) | ... | Total
    let thRow1 = '<tr style="background:var(--bg-tertiary);">';
    thRow1 += '<th rowspan="2" style="text-align:left;padding:10px 14px;position:sticky;left:0;background:var(--bg-tertiary);z-index:5;min-width:130px;">PERIHAL</th>';
    res.bulan.forEach(b => {
        thRow1 += `<th colspan="2" style="text-align:center;padding:8px;border-left:2px solid var(--border-color);">${b.toUpperCase()}</th>`;
    });
    thRow1 += '<th colspan="2" style="text-align:center;padding:8px;border-left:2px solid var(--border-color);background:rgba(102,126,234,.15);">TOTAL</th>';
    thRow1 += '</tr>';

    // Row 2: SM | SACC untuk setiap bulan
    let thRow2 = '<tr style="background:var(--bg-tertiary);">';
    for (let m = 0; m < 12; m++) {
        thRow2 += '<th style="text-align:center;padding:6px 8px;font-size:11px;color:#4facfe;border-left:2px solid var(--border-color);">SM</th>';
        thRow2 += '<th style="text-align:center;padding:6px 8px;font-size:11px;color:#43e97b;">SACC</th>';
    }
    thRow2 += '<th style="text-align:center;padding:6px 8px;font-size:11px;color:#4facfe;border-left:2px solid var(--border-color);background:rgba(102,126,234,.15);">SM</th>';
    thRow2 += '<th style="text-align:center;padding:6px 8px;font-size:11px;color:#43e97b;background:rgba(102,126,234,.15);">SACC</th>';
    thRow2 += '</tr>';

    thead.innerHTML = thRow1 + thRow2;

    // --- BODY ---
    let tbHTML = '';

    // Satu row per kategori
    res.kategori.forEach((k, ki) => {
        const rowBg = ki % 2 === 0 ? '' : 'background:var(--bg-hover);';
        tbHTML += `<tr style="${rowBg}">`;
        tbHTML += `<td style="font-weight:600;padding:10px 14px;position:sticky;left:0;background:${ki % 2 === 0 ? 'var(--bg-secondary)' : 'var(--bg-hover)'};z-index:3;">${k}</td>`;

        let totalTawaran = 0, totalDiterima = 0;
        for (let m = 0; m < 12; m++) {
            const cell = res.data[k][m];
            totalTawaran  += cell.tawaran;
            totalDiterima += cell.diterima;
            tbHTML += `<td class="rekap-tawaran"  style="border-left:2px solid var(--border-color);padding:8px;">${cell.tawaran || '-'}</td>`;
            tbHTML += `<td class="rekap-diterima" style="padding:8px;">${cell.diterima || '-'}</td>`;
        }
        // Total columns
        tbHTML += `<td class="rekap-tawaran"  style="border-left:2px solid var(--border-color);padding:8px;background:rgba(102,126,234,.1);">${totalTawaran}</td>`;
        tbHTML += `<td class="rekap-diterima" style="padding:8px;background:rgba(102,126,234,.1);">${totalDiterima}</td>`;
        tbHTML += '</tr>';
    });

    // Row JUMLAH (grand total per bulan)
    tbHTML += '<tr class="rekap-total-row" style="border-top:2px solid var(--border-color);">';
    tbHTML += '<td style="font-weight:700;padding:10px 14px;position:sticky;left:0;background:var(--bg-tertiary);z-index:3;">JUMLAH</td>';

    let grandSM = 0, grandSACC = 0;
    for (let m = 0; m < 12; m++) {
        let monthSM = 0, monthSACC = 0;
        res.kategori.forEach(k => {
            monthSM   += res.data[k][m].tawaran;
            monthSACC += res.data[k][m].diterima;
        });
        grandSM   += monthSM;
        grandSACC += monthSACC;
        tbHTML += `<td style="border-left:2px solid var(--border-color);padding:8px;color:#4facfe;font-weight:700;">${monthSM || '-'}</td>`;
        tbHTML += `<td style="padding:8px;color:#43e97b;font-weight:700;">${monthSACC || '-'}</td>`;
    }
    tbHTML += `<td style="border-left:2px solid var(--border-color);padding:8px;color:#4facfe;font-weight:800;background:rgba(102,126,234,.15);">${grandSM}</td>`;
    tbHTML += `<td style="padding:8px;color:#43e97b;font-weight:800;background:rgba(102,126,234,.15);">${grandSACC}</td>`;
    tbHTML += '</tr>';

    tbody.innerHTML = tbHTML;
}

/**
 * Chart Bar — Tawaran vs Diterima per bulan
 */
function renderLaporanChart(res, filterKategori) {
    const ctx = document.getElementById('chart-laporan-rekap');
    if (!ctx) return;

    // Aggregate bulan
    const tawaranArr  = [];
    const diterimaArr = [];

    for (let m = 0; m < 12; m++) {
        let sm = 0, sacc = 0;
        res.kategori.forEach(k => {
            if (filterKategori === 'all' || filterKategori === k) {
                sm   += res.data[k][m].tawaran;
                sacc += res.data[k][m].diterima;
            }
        });
        tawaranArr.push(sm);
        diterimaArr.push(sacc);
    }

    if (_laporanChartInstance) {
        _laporanChartInstance.destroy();
        _laporanChartInstance = null;
    }

    _laporanChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: res.bulan,
            datasets: [
                {
                    label: 'SM (Tawaran / Surat Masuk)',
                    data: tawaranArr,
                    backgroundColor: 'rgba(79,172,254,0.7)',
                    borderColor: '#4facfe',
                    borderWidth: 2,
                    borderRadius: 6,
                },
                {
                    label: 'SACC (Diterima)',
                    data: diterimaArr,
                    backgroundColor: 'rgba(67,233,123,0.7)',
                    borderColor: '#43e97b',
                    borderWidth: 2,
                    borderRadius: 6,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top' },
                tooltip: {
                    callbacks: {
                        afterLabel: function(ctx) {
                            const idx = ctx.dataIndex;
                            const sm   = tawaranArr[idx];
                            const sacc = diterimaArr[idx];
                            if (ctx.datasetIndex === 1 && sm > 0) {
                                return 'Rate: ' + Math.round((sacc / sm) * 100) + '%';
                            }
                            return '';
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });
}

/**
 * Switch chart filter kategori
 */
function switchLaporanChart(filterKategori) {
    if (!_laporanRawData) return;
    renderLaporanChart(_laporanRawData, filterKategori);
}

/**
 * Acceptance rate progress bars per kategori
 */
function renderLaporanRateBars(res) {
    const container = document.getElementById('laporan-rate-bars');
    if (!container) return;

    const gradients = {
        'Magang':      'linear-gradient(90deg,#667eea,#764ba2)',
        'PKL':         'linear-gradient(90deg,#f093fb,#f5576c)',
        'KKN Profesi': 'linear-gradient(90deg,#4facfe,#00f2fe)',
        'Penelitian':  'linear-gradient(90deg,#43e97b,#38f9d7)',
    };

    let html = '';
    res.kategori.forEach(k => {
        const s = res.summary[k];
        const rateColor = s.rate >= 80 ? '#43e97b' : s.rate >= 50 ? '#f59e0b' : '#ef4444';
        const pct = Math.min(s.rate, 100);
        const grad = gradients[k] || 'linear-gradient(90deg,#9ca3af,#6b7280)';
        html += `
        <div class="laporan-rate-bar-wrap">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <div style="font-weight:600; font-size:14px; color:var(--text-primary);">${k}</div>
                <div style="display:flex; gap:16px; align-items:center;">
                    <span style="font-size:12px; color:var(--text-secondary);">${s.totalDiterima} / ${s.totalTawaran}</span>
                    <span style="font-size:16px; font-weight:800; color:${rateColor};">${s.rate}%</span>
                </div>
            </div>
            <div class="laporan-rate-bar-track">
                <div class="laporan-rate-bar-fill" style="width:0%; background:${grad};"
                     data-pct="${pct}"></div>
            </div>
        </div>`;
    });
    container.innerHTML = html;

    // Animate bars setelah render
    setTimeout(() => {
        container.querySelectorAll('.laporan-rate-bar-fill').forEach(el => {
            el.style.width = el.dataset.pct + '%';
        });
    }, 100);
}

/**
 * Export rekapitulasi ke CSV
 */
function exportLaporanCSV() {
    if (!_laporanRawData) return;
    const res = _laporanRawData;

    let csvRows = [];
    // Header row 1
    let h1 = ['PERIHAL'];
    res.bulan.forEach(b => { h1.push(b + ' SM'); h1.push(b + ' SACC'); });
    h1.push('TOTAL SM'); h1.push('TOTAL SACC'); h1.push('RATE');
    csvRows.push(h1.join(','));

    // Data rows
    res.kategori.forEach(k => {
        let row = [k];
        let totSM = 0, totSACC = 0;
        for (let m = 0; m < 12; m++) {
            row.push(res.data[k][m].tawaran);
            row.push(res.data[k][m].diterima);
            totSM   += res.data[k][m].tawaran;
            totSACC += res.data[k][m].diterima;
        }
        const rate = totSM > 0 ? Math.round((totSACC / totSM) * 100) : 0;
        row.push(totSM); row.push(totSACC); row.push(rate + '%');
        csvRows.push(row.join(','));
    });

    // Grand total row
    let gtRow = ['JUMLAH'];
    for (let m = 0; m < 12; m++) {
        let sm = 0, sacc = 0;
        res.kategori.forEach(k => { sm += res.data[k][m].tawaran; sacc += res.data[k][m].diterima; });
        gtRow.push(sm); gtRow.push(sacc);
    }
    const gt = res.grandTotal;
    gtRow.push(gt.totalTawaran); gtRow.push(gt.totalDiterima); gtRow.push(gt.rate + '%');
    csvRows.push(gtRow.join(','));

    const csvContent = '\uFEFF' + csvRows.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'Rekap_Magang_' + (res.year || 'all') + '.csv';
    a.click();
    URL.revokeObjectURL(url);

    if (typeof showToast === 'function') showToast('success', 'Export Berhasil', 'File CSV berhasil diunduh.');
}

// ============================================================
// ===== AUTO-TRIGGER LAPORAN WHEN PAGE BECOMES ACTIVE ========
// ============================================================
(function() {
    function hookLaporanPage() {
        const laporanPage = document.getElementById('page-laporan');
        if (!laporanPage) return;

        // MutationObserver: deteksi saat class 'active' ditambahkan ke page-laporan
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === 'class') {
                    const isActive = laporanPage.classList.contains('active');
                    if (isActive && typeof loadLaporanRekap === 'function') {
                        // Hanya load jika belum pernah load sebelumnya untuk sesi ini
                        if (!window._laporanLoaded) {
                            window._laporanLoaded = true;
                            loadLaporanRekap();
                        }
                    }
                    // Reset flag saat navigasi pergi
                    if (!isActive) {
                        window._laporanLoaded = false;
                    }
                }
            });
        });

        observer.observe(laporanPage, { attributes: true });

        // Juga hook nav-item click via event delegation (sebagai backup)
        document.addEventListener('click', function(e) {
            const navItem = e.target.closest('[data-page="laporan"]');
            if (navItem && typeof loadLaporanRekap === 'function') {
                setTimeout(function() {
                    loadLaporanRekap();
                }, 100);
            }
        });
    }

    // Jalankan setelah DOM siap
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hookLaporanPage);
    } else {
        hookLaporanPage();
    }
})();

/**
 * [NEW] Mengambil daftar tahun dari server untuk sidebar laporan
 */
function loadLaporanYears() {
    google.script.run
        .withSuccessHandler(function (response) {
            if (response.success && response.years) {
                renderLaporanSidebar(response.years);
            } else {
                console.error('Gagal memuat tahun laporan:', response.message);
            }
        })
        .getMagangYears();
}

/**
 * [NEW] Merender daftar tahun ke dalam submenu sidebar
 */
function renderLaporanSidebar(years) {
    const submenu = document.getElementById('submenu-laporan');
    if (!submenu) return;
    
    if (years.length === 0) {
        submenu.innerHTML = '<li class="submenu-item disabled" style="opacity: 0.5;">Tidak ada data</li>';
        return;
    }

    submenu.innerHTML = years.map(year => `
        <li class="submenu-item" onclick="navigateToYear(${year})">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #667eea; opacity: 0.5;"></span>
            Tahun ${year}
        </li>
    `).join('');
}

/**
 * [NEW] Navigasi ke tahun tertentu di halaman laporan
 */
function navigateToYear(year) {
    // 1. Berpindah ke halaman Laporan (Analytics)
    navigateToPage('laporan');
    
    // 2. Isi input tahun di halaman laporan
    const yearInput = document.getElementById('laporan-year-filter');
    if (yearInput) {
        yearInput.value = year;
        
        // 3. Trigger pemuatan data ulang untuk tahun tersebut
        // Pastikan loadLaporanRekap dipanggil setelah halaman aktif
        setTimeout(() => {
            loadLaporanRekap();
        }, 100);
    }
}
